name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup OCI CLI
        run: |
          pip install oci-cli --quiet
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_PRIVATE_KEY }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          cat <<EOF > ~/.oci/config
          [DEFAULT]
          user=${{ secrets.OCI_USER_OCID }}
          fingerprint=${{ secrets.OCI_FINGERPRINT }}
          key_file=~/.oci/oci_api_key.pem
          tenancy=${{ secrets.OCI_TENANCY_OCID }}
          region=${{ secrets.OCI_REGION }}
          EOF
          chmod 600 ~/.oci/config

      - name: Create DNS Record if not exists
        run: |
          # 1. Consulta a API da Oracle filtrando diretamente por subdomínio e tipo A
          EXISTS=$(oci dns record zone get \
            --zone-name-or-id "${{ secrets.OCI_ZONE_NAME }}" \
            --scope GLOBAL \
            --domain "${{ secrets.DOMAIN }}" \
            --rtype A \
            --all \
            --query "data.items | length(@)" \
            --raw-output 2>/dev/null || echo "0")

          echo "Registros encontrados: $EXISTS"

          # 2. Se encontrar 1 ou mais registros, pula a criação
          if [ "$EXISTS" -gt "0" ]; then
            echo "Subdomínio ${{ secrets.DOMAIN }} já existe no DNS da Oracle. Pulando criação para evitar alterações."
          else
            echo "Subdomínio ${{ secrets.DOMAIN }} não encontrado. Criando registro A..."
            oci dns record zone patch \
              --zone-name-or-id "${{ secrets.OCI_ZONE_NAME }}" \
              --scope GLOBAL \
              --items '[{"action": "ADD", "domain": "'"${{ secrets.DOMAIN }}"'", "rtype": "A", "rdata": "'"${{ secrets.SSH_HOST }}"'", "ttl": 300}]'
          fi

      - name: Copy stack file to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "docker-compose.yml"
          target: "~/app/${{ github.event.repository.name }}"

      - name: Deploy stack via SSH
        uses: appleboy/ssh-action@v1
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          envs: GH_TOKEN
          script: |
            set -e
            echo "$GH_TOKEN" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            export DOMAIN="${{ secrets.DOMAIN }}"
            export IMAGE="ghcr.io/${{ github.repository }}:latest"
            export STACK_NAME="${{ github.event.repository.name }}"
            cd ~/app/${{ github.event.repository.name }}
            docker pull "$IMAGE"
            docker stack deploy -c docker-compose.yml --with-registry-auth ${{ github.event.repository.name }}
            docker image prune -f